server {
  listen 80;
  server_name vcdn1-rf.servep2p.com vcdn1-rf.ru;
  location / {
    sub_filter 'vcdn1.servep2p.com'  'vcdn1-rf.ru';
    sub_filter_types 'application/json';
    sub_filter_once off;

    resolver 8.8.8.8;

    proxy_pass https://vcdn1.servep2p.com;
    proxy_redirect off;

    proxy_intercept_errors on;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header Host vcdn1.servep2p.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name vairgin.vcdn1-rf.ru;

  location / {
    resolver 8.8.8.8;

    sub_filter 'vairgin.com' 'vairgin.vcdn1-rf.ru';
    sub_filter_once off;
    sub_filter_types *;

    proxy_set_header Accept-Encoding "";
    proxy_set_header Host vairgin.com;

    proxy_pass http://136.243.110.203:8132/;
  }
}

server {
  listen 80;
  server_name vairgin-2.vcdn1-rf.ru;
  location / {
    proxy_set_header Accept-Encoding "";
    sub_filter 'vairgin-2.com' 'vairgin-2.vcdn1-rf.ru';
    sub_filter 'vcdn1.servep2p.com'  'vcdn1-rf.ru';
    sub_filter_types "*";
    sub_filter_once off;

    resolver 8.8.8.8;

    proxy_pass https://vairgin-2.com;
    proxy_redirect off;

    proxy_intercept_errors on;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header Host vairgin-2.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name passbolt01.webhop.me;
  location / {
    access_log off;
    proxy_pass http://athink.hopto.org:19180;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cookie_path / "/; Secure; SameSite=none";
    fastcgi_read_timeout 3000;
    fastcgi_connect_timeout 3000;
    fastcgi_send_timeout 3000;
  }
}
